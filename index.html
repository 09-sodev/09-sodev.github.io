<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0xdecodeyourself</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; color: #fff; font-family: system-ui, -apple-system, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; text-align: center; }
        .badge { border: 1px solid #D4860F; border-radius: 20px; padding: 8px 16px; margin-bottom: 40px; font-size: 12px; color: #D4860F; display: inline-block; }
        h1 { font-size: 100px; font-weight: 700; margin-bottom: 20px; line-height: 1; word-break: break-word; }

        .email { color: #D4860F; margin-top: 60px; font-size: 14px; }
        footer { position: fixed; bottom: 20px; font-size: 12px; color: #666; }
        
        @media (max-width: 768px) {
            h1 { font-size: 60px; }
            p { font-size: 14px; }
            .email { font-size: 13px; }
        }
        
        @media (max-width: 480px) {
            body { padding: 1.5rem; }
            h1 { font-size: 45px; margin-bottom: 15px; }
            p { font-size: 13px; max-width: 100%; }
            .badge { margin-bottom: 30px; padding: 6px 12px; font-size: 11px; }
            .email { margin-top: 40px; font-size: 12px; }
        }
        
        @media (max-width: 320px) {
            h1 { font-size: 36px; }
            p { font-size: 12px; }
            .badge { font-size: 10px; }
        }
    </style>
</head>
<body>

    <p class="email">hiangeloddo@gmail.com</p>
    <footer>© 2026 - All Rights Reserved</footer>
</body>
</html>
