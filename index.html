<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Career coaching for college students & recent grads. Coming soon.">
    <title>0xdecodeyourself | Coming Soon</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            height: 100%;
            background: linear-gradient(135deg, #faf9f7 0%, #f5f3f0 100%);
            color: #2a2a2a;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        
        :root {
            --gold: #F4B860;
        }
        
        .container {
            max-width: 700px;
            text-align: center;
            padding: 2rem;
        }
        
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 96px;
            line-height: 0.9;
            font-weight: 700;
            margin-bottom: 1.5rem;
            letter-spacing: -2px;
        }
        
        h1 .accent {
            color: var(--gold);
        }
        
        .subtitle {
            font-size: 20px;
            color: #666;
            line-height: 1.8;
            margin-bottom: 2rem;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .email-section {
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid #ddd;
        }
        
        .email-label {
            font-size: 12px;
            color: #999;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 0.75rem;
        }
        
        .email-link {
            display: inline-block;
            color: var(--gold);
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
            transition: all 0.3s;
            border-bottom: 2px solid var(--gold);
            padding-bottom: 4px;
        }
        
        .email-link:hover {
            color: #2a2a2a;
            border-bottom-color: #2a2a2a;
        }
        
        .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--gold);
            border-radius: 50%;
            margin: 2rem 0;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .status {
            font-size: 12px;
            color: #999;
            margin-top: 2rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 52px;
            }
            
            .subtitle {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Decode <span class="accent">yourself</span>.</h1>
        <p class="subtitle">Career coaching for college students and recent grads who want to build something real.</p>
        
        <div class="dot"></div>
        
        <div class="email-section">
            <p class="email-label">Making Updates</p>
            <a href="mailto:hiangeloddo@gmail.com" class="email-link">hiangeloddo@gmail.com</a>
            <p class="status">Launching soon. Stay tuned.</p>
        </div>
    </div>
</body>
</html>
