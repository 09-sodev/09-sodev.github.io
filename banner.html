<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0xdecodeyourself Banner</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #ffffff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        
        .banner {
            width: 1200px;
            height: 627px;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px 80px;
            position: relative;
        }
        
        h1 {
            font-size: 88px;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 30px;
            letter-spacing: -2px;
            text-transform: uppercase;
        }
        
        h1 .gold {
            color: #F4B860;
        }
        
        h1 .black {
            color: #1a1a1a;
        }
        
        .subtitle {
            font-size: 18px;
            color: #555;
            line-height: 1.8;
            max-width: 650px;
            font-weight: 500;
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <div class="banner">
        <h1><span class="black">DECODE</span> <span class="gold">YOURSELF</span>.</h1>
        <p class="subtitle">Career coaching for college students and recent grads who want to build something real. Find opportunities curated by values, not just salary.</p>
    </div>
</body>
</html>
